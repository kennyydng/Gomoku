
services:
  gomoku:
    build: .
    # L'image Arch du projet n'est publiee qu'en amd64, et le moteur exige AVX2
    # de toute facon. Sur un hote arm64 (Mac Apple Silicon), Docker refuse de
    # choisir l'emulation tout seul : « no match for platform in manifest ».
    # Sur un hote amd64 cette ligne ne change rien.
    #
    # ATTENTION : sous emulation, les temps mesures ne veulent rien dire. Le
    # critere des 500 ms par coup ne se verifie que sur une machine x86.
    platform: linux/amd64
    entrypoint: [bash,/var/docker-entrypoint.sh]
    ports: [3000:3000]
    environment:
      - TZ=Europe/Paris
    # Pas de montage de ./logs : rien n'ecrit dans /var/logs, qui n'existe meme
    # pas dans l'image, et le dossier etant gitignore il manque apres un clone.
    # Docker le creait a la volee ; podman refuse et fait echouer `up` — ce qui
    # cassait la relance apres un `stop` ou un `down`.
    #
    # Le rechargement a chaud passe par develop.watch ci-dessous, pas par des
    # montages de sources.
    develop:
      watch:
        - action: sync
          path: bot
          target: /var/www/app/bot
        - action: sync
          path: app
          target: /var/www/app
